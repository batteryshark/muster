[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "muster"
version = "0.0.1"
description = "A ledgered investigation runtime: durable, coverage-gated, resumable work-graph execution with bounded adaptive model steps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "batteryshark" }]
keywords = ["workflow", "graph", "ledger", "coverage", "durable", "resumable", "investigation"]

# The core is deliberately light: run identity, on-disk layout, the SQLite ledger, and the
# graph scaffolding. An application registers its own domain (tables, handlers, coverage
# predicate). Bounded model steps are an optional extra so the core stays dependency-free
# for applications that do not use them.
dependencies = [
    "pydantic-graph>=0.0.1",
]

[project.optional-dependencies]
# For applications that build bounded, typed model steps on top of muster.
model = ["pydantic-ai>=2.6,<3"]
# Everything the runnable examples/ need (a pydantic-ai agent step). Not shipped in the
# wheel — examples/ lives at the repo root, outside the packaged src/muster.
examples = ["pydantic-ai>=2.6,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/muster"]

# The spine schema is a .sql data file loaded at runtime by muster.ledger. `packages`
# only grabs .py modules, so force-include it or the wheel ships a ledger that cannot
# create its own tables.
[tool.hatch.build.targets.wheel.force-include]
"src/muster/schema.sql" = "muster/schema.sql"

[tool.pytest.ini_options]
# muster's own test suite, run with pytest from the repo root.
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
